<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>닝이줘 - 일반외과 3년차 레지던트</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
                :root {
            --hospital-blue: #0f0f43;
            --hospital-blue-light: #1e3a8a;
            --primary: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #0ea5e9;
            --accent: #06b6d4;
            --bg: #fafbfc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

                body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: #e5e7eb;
            color: var(--text-primary);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px var(--shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }

                                .profile-header {
            background: linear-gradient(135deg, #0f0f43 0%, #1e3a8a 40%, #2563eb 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }

                        .work-badge {
    display: inline-block;
    padding: 10px 24px;
    border-radius: 25px;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: white;
    box-shadow: 0 4px 15px rgba(55, 65, 81, 0.5);
    letter-spacing: 0.5px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
        }
        
        .work-badge:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(55, 65, 81, 0.6);
        }
        
        .work-badge.current {
            background: linear-gradient(135deg, #374151 0%, #6b7280 50%, #9ca3af 100%);
        }

        .profile-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .profile-header .subtitle {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 400;
        }

        .profile-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            padding: 40px;
        }

        .profile-image {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-details {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .detail-section {
            background: var(--bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

                .detail-section h2 {
            font-size: 1.3rem;
            color: var(--hospital-blue);
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-section h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--hospital-blue);
            border-radius: 2px;
        }

        .info-grid {
            display: grid;
            gap: 12px;
        }

        .info-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .info-value {
            color: var(--text-primary);
        }

        .career-list {
            list-style: none;
            padding: 0;
        }

        .career-list li {
            padding: 12px 0;
            padding-left: 24px;
            position: relative;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .career-list li::before {
            content: '▪';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        .specialty-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .specialty-tag {
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .back-button:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        @media (max-width: 768px) {
            .profile-content {
                grid-template-columns: 1fr;
            }

            .profile-header h1 {
                font-size: 2rem;
            }

            .info-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    
        .appointment-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin: 18px auto 0;
            padding: 10px 20px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .appointment-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        .appointment-icon {
            font-size: 1.2rem;
        }

</style>
</head>
