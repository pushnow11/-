<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강슬기 - 흉부외과 4년차 치프 레지던트</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #0ea5e9;
            --accent: #06b6d4;
            --bg: #fafbfc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #fafbfc 100%);
            color: var(--text-primary);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px var(--shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .work-badge {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            letter-spacing: 0.5px;
        }

        .profile-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .profile-header .subtitle {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 400;
        }

        .profile-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            padding: 40px;
        }

        .profile-image {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-details {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .detail-section {
            background: var(--bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .detail-section h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-section h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
        }

        .info-grid {
            display: grid;
            gap: 12px;
        }

        .info-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .info-value {
            color: var(--text-primary);
        }

        .career-list {
            list-style: none;
            padding: 0;
        }

        .career-list li {
            padding: 12px 0;
            padding-left: 24px;
            position: relative;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .career-list li::before {
            content: '▪';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        .specialty-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .specialty-tag {
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .back-button:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        @media (max-width: 768px) {
            .profile-content {
                grid-template-columns: 1fr;
            }

            .profile-header h1 {
                font-size: 2rem;
            }

            .info-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    </style>
</head>
